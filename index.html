<!DOCTYPE html>
<html>
<head>
<title>Valentine Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins', sans-serif;
  overflow:hidden;
  background: linear-gradient(135deg,#fbc2eb,#a6c1ee);
  color:#5a3e5b;
  text-align:center;
}

nav{
  position:fixed;
  top:0;
  width:100%;
  padding:15px;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.2);
  font-weight:600;
}

.section{display:none;padding-top:100px;}

h1{
  font-family:'Playfair Display', serif;
  font-size:48px;
  color:#7b2cbf;
  animation: fadeIn 2s ease-in-out;
}

button{
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  margin:10px;
  transition:0.3s;
}

#yesBtn{
  background:#7b2cbf;
  color:white;
  box-shadow:0 4px 15px rgba(123,44,191,0.4);
}

#noBtn{
  background:white;
  color:#7b2cbf;
  position:absolute;
}

#startScreen{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#c3aed6,#f5d0fe);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:10;
}

.petal{
  position:fixed;
  top:-10px;
  font-size:24px;
  animation: fall linear infinite;
}

@keyframes fall{
  to{transform:translateY(100vh);}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(-20px);}
  to{opacity:1;}
}
</style>
</head>

<body>

<div id="startScreen">
  <h2>💌 Important Message</h2>
  <button onclick="startSite()">Click Here</button>
</div>

<nav>
  My Special Valentine Page 💖
</nav>

<div id="main" class="section">
  <h1>Angel, Will you be my Valentine? ❤️</h1>
  <button id="yesBtn" onclick="showLove()">Yes 💖</button>
  <button id="noBtn" onmouseover="moveNo()">No </button>
</div>

<script>
function startSite(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("main").style.display="block";
}

function moveNo(){
  let btn=document.getElementById("noBtn");
  btn.style.top=Math.random()*80+"vh";
  btn.style.left=Math.random()*80+"vw";
}

function showLove(){
  document.body.innerHTML += `
  <div class="section" style="display:block">
    <h1>You just made my world brighter 🌸</h1>
    <p style="font-size:22px">From the moment we met, every little thing became special.
    Today is just a small excuse to remind you how important you are to me. 💕</p>
  </div>`;
  showerPetals();
}

function showerPetals(){
  setInterval(()=>{
    let petal=document.createElement("div");
    petal.className="petal";
    petal.innerHTML="🌸";
    petal.style.left=Math.random()*100+"vw";
    petal.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(petal);
    setTimeout(()=>petal.remove(),5000);
  },200);
}
</script>

</body>
</html>
